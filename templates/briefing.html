<html lang="zh-CN">

  <style>

    .brief-rows{border-top:1px solid #aeb9c8}.brief-row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:22px;padding:20px 0;border-bottom:1px solid var(--line)}.brief-meta time{display:block;color:#4e596d;font:850 13px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace}.brief-meta span{display:inline-block;margin-top:6px;padding:1px 6px;border-radius:3px;background:#f0e4f5;color:#75418e;font-size:10px;font-weight:800}.brief-copy h3{margin:0 0 7px}.brief-copy h3 a{color:#29364b;text-decoration:none}.brief-copy p{margin:0 0 8px;color:#465267}.brief-boundary{padding-left:10px;border-left:3px solid #cfb8d3;color:#79677c!important;font-size:12px}.empty-state{padding:18px 20px;border:1px dashed #ccb9d0;background:#fcf9fd;color:var(--muted);font-size:13px}.sources{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 2px}.sources a{display:inline-flex;padding:2px 6px;border-bottom:1px solid #9eacc0;color:#7c4a92;text-decoration:none;font-size:10px;font-weight:700}
    #full{padding-top:52px}#full>.full-title{margin:0 0 12px;padding-bottom:9px;border-bottom:2px solid #decbe2}.full-intro{padding:18px 20px;border-left:4px solid var(--purple);background:var(--purple-soft)}.full-intro p{margin:0}.full-section{padding-top:44px}.full-section-head{display:flex;gap:14px;align-items:baseline;padding-bottom:9px;border-bottom:2px solid #decbe2}.full-section-head span{font:700 30px/1 Georgia,serif;color:#cba8cd}.full-section-head h2{margin:0;font-size:24px}.deep-item{padding:23px 0 27px;border-bottom:1px solid var(--line)}.deep-item h3{margin:0 0 12px;font-size:20px}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}.badge{padding:2px 7px;border-radius:4px;background:#f0e4f5;color:#75418e;font-size:10px;font-weight:800}.badge.secondary{background:#f2edf6;color:#74657d}.block{display:grid;grid-template-columns:92px minmax(0,1fr);gap:14px;margin:10px 0}.block strong{color:var(--purple);font-size:12px}.block p{margin:0;color:#3f4b60}.boundary-block{margin:14px 0;padding:11px 12px;background:#faf7fb;border-left:3px solid #c7b0cc}.boundary-block strong{color:#7b687f}.facts{color:#3f4b60}footer{margin-top:58px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
    .repo-summary{max-width:850px;color:#3f4b60;font-size:16px;font-weight:700}.generation-arrow{color:#c06b94;text-align:center;font-weight:900}.observation-grid article{padding:11px;background:rgba(255,255,255,.7);border-left:3px solid var(--pink)}.observation-grid article strong,.observation-grid article p{display:block}.observation-grid article p{margin:3px 0 0;color:#566176;font-size:11px}.comparison-wrap table{width:100%;border-collapse:collapse;background:#fff;font-size:11px}.comparison-wrap th,.comparison-wrap td{padding:8px;border:1px solid var(--line);text-align:left;vertical-align:top}.comparison-wrap th{background:#f3e8f5;color:#65466e}
    .model-timeline{display:block;position:relative;overflow:visible;padding:4px 0 4px 88px}.model-timeline:before{left:70px;right:auto;top:8px;bottom:8px;width:2px;height:auto}.model-release{display:grid;grid-template-columns:58px 24px minmax(0,1fr);grid-template-rows:auto;align-items:start;margin:0 0 28px -88px}.timeline-date{padding-top:7px}.timeline-marker{margin:7px 0 0 5px}.model-card{display:block;min-width:0;padding:22px}.model-copy{min-width:0}.official-figure{margin:20px 0 0;padding:12px;border:1px solid var(--line);background:#fcfafc}.official-figure img{display:block;width:100%;height:auto;max-height:none;object-fit:contain;background:#fff}.official-figure figcaption{margin-top:8px;color:#6c7381;font-size:10px;line-height:1.45}.figure-unavailable{margin:18px 0 0;padding:14px;border:1px dashed #cdbad1;background:#faf6fb;color:#716478;font-size:12px}.light-signals{margin-top:18px;border-top:1px solid var(--line)}.light-signals-label{padding:13px 0 5px;color:#76547e;font-size:11px;font-weight:850;letter-spacing:.06em}.light-signals article{display:grid;grid-template-columns:70px minmax(0,1fr);gap:14px;padding:12px 0;border-bottom:1px dashed #e5dbe7}.light-signals time{color:#7c6781;font:800 11px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}.light-signals h3{margin:0 0 3px;font-size:14px}.light-signals h3 a{color:#303b4d;text-decoration:none}.light-signals p{margin:0;color:#667084;font-size:12px;line-height:1.5}.architecture-trend{margin-top:26px;padding:20px;border:1px solid #dec9df;background:linear-gradient(145deg,#fff8fb,#f8f0fb)}.architecture-trend h3{margin:0 0 12px}.muon-trend{display:grid;gap:3px;margin:14px 0;padding:13px 14px;border-left:4px solid var(--purple);background:#fff}.muon-trend strong{color:#654172}.muon-trend span{color:#4d586b;font-size:12px}.muon-trend small{color:#817583;font-size:10px}.recommended-heading{margin:12px 0 7px;color:#72517b;font-size:11px;font-weight:800}
    .shell{grid-template-columns:240px minmax(0,1fr)}.sidebar{padding-right:18px;padding-left:18px}main{width:min(1180px,100%)}
    .trend-break{float:right;width:132px;margin:-122px 24px 8px 18px}.trend-break img{display:block;width:100%;height:auto}
    .section-spotlights{display:grid;gap:12px;margin:4px 0 22px}.section-spotlight{padding:19px 20px;border:1px solid #d8c3dd;border-left:5px solid var(--pink);background:linear-gradient(135deg,#fff8fb,#f5eef9)}.spotlight-kicker{margin-bottom:5px;color:var(--pink);font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.section-spotlight h3{margin:0 0 8px;font-size:20px}.spotlight-thesis{max-width:900px;color:#445167;font-size:14px;font-weight:700}.spotlight-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}.spotlight-grid>div{padding:11px 12px;background:rgba(255,255,255,.72)}.spotlight-grid strong{color:#75418e;font-size:11px}.spotlight-grid p{margin:3px 0 0;color:#5e6879;font-size:11px}.spotlight-evidence{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:12px}.spotlight-evidence a{display:grid;gap:2px;padding:8px 10px;border:1px solid #e2d3e5;background:#fff;text-decoration:none}.spotlight-evidence strong{color:#3a4559;font-size:11px}.spotlight-evidence span{color:#85768a;font-size:10px}
    @media(max-width:960px){.shell{grid-template-columns:210px minmax(0,1fr)}main{padding:42px 28px 76px}.repo-themes{grid-template-columns:1fr}.recommended-links{grid-template-columns:1fr}}
    @media(max-width:760px){.shell{display:block}.sidebar{position:fixed;z-index:80;width:min(320px,88vw);transform:translateX(-105%);transition:.2s;box-shadow:20px 0 50px rgba(18,31,55,.18)}.sidebar.open{transform:none}.mobile-nav{display:block;position:fixed;z-index:90;right:14px;bottom:14px;width:46px;height:46px;border:0;border-radius:50%;background:var(--purple);color:#fff;font-size:20px}main{padding:34px 19px 72px}.section-heading{grid-template-columns:42px minmax(0,1fr)}.brief-row,.block{grid-template-columns:1fr;gap:5px}.brief-section.accent-section{margin-left:-9px;margin-right:-9px;padding-left:13px;padding-right:13px}.model-timeline{grid-auto-flow:row;grid-auto-columns:auto;overflow:visible;padding-left:18px}.model-timeline:before{left:24px;right:auto;top:33px;bottom:12px;width:2px;height:auto}.model-release{grid-template-columns:60px 22px minmax(0,1fr);grid-template-rows:auto;align-items:start}.timeline-date{padding-top:3px}.timeline-marker{margin:1px 0 0}.model-card{min-width:0}.architecture-flow{max-width:calc(100vw - 150px)}.generation-row{grid-template-columns:1fr}.generation-row b{display:none}.generation-row small{grid-column:auto}.observation-grid,.spotlight-grid{grid-template-columns:1fr}.section-heading>span{font-size:26px}}
    @media(max-width:760px){.model-timeline{padding-left:0}.model-release{display:grid;grid-template-columns:54px 20px minmax(0,1fr);margin-left:0}.model-timeline:before{left:63px}.model-card{padding:15px;gap:15px}.official-figure{order:0}.generation-row{display:grid;grid-template-columns:1fr;gap:3px}.generation-arrow{display:none}.generation-row small{grid-column:auto}.architecture-trend{padding:14px}.compact .brief-row{grid-template-columns:56px minmax(0,1fr)}}

    @media print{body{background:#fff}.shell{display:block}.sidebar,.mobile-nav,.progress,.hero-actions{display:none!important}main{width:100%;max-width:none;padding:0}.model-timeline{overflow:visible}.brief-row,.deep-item,.model-release{break-inside:avoid}a{color:inherit;text-decoration:none}}
  </style>
</head>
<body>
  <div class="progress" id="progress" aria-hidden="true"></div>
  <button class="mobile-nav" id="mobile-nav" aria-label="打开目录" aria-expanded="false">☰</button>
  <div class="shell">
    <aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-mark">LLM</div><div><strong>Infra Briefing</strong><small>Engineering notes</small></div></div><div class="side-meta"><strong>{{WINDOW}}</strong><br>HTML-first · evidence linked</div><nav>{{NAVIGATION}}</nav></aside>
    <main>
      <header id="overview"><p class="kicker"><span class="pill">LLM INFRA</span><span>{{WINDOW}}</span><span>·</span><span>双周简报</span></p><h1>{{DATE_TITLE}}</h1><p class="lede">{{DEK}}</p><div class="hero-actions"><a class="button primary" href="#section-model_progress">开始阅读</a></div></header>
      {{EASTER_EGG}}
      <div id="briefing">{{CONTENT}}</div>
      <footer>由结构化 edition 数据生成 · {{GENERATED_AT}}</footer>
    </main>
  </div>
  <script>
    const progress=document.getElementById("progress"),links=[...document.querySelectorAll("nav a")];addEventListener("scroll",()=>{const h=document.documentElement;progress.style.width=((h.scrollTop/(h.scrollHeight-h.clientHeight))*100)+"%";let current="overview";for(const el of document.querySelectorAll("header[id],section[id],article[id]"))if(el.getBoundingClientRect().top<130)current=el.id;links.forEach(a=>a.classList.toggle("active",a.hash==="#"+current));},{passive:true});const button=document.getElementById("mobile-nav"),sidebar=document.getElementById("sidebar");button.addEventListener("click",()=>{sidebar.classList.toggle("open");button.setAttribute("aria-expanded",String(sidebar.classList.contains("open")))});links.forEach(a=>a.addEventListener("click",()=>sidebar.classList.remove("open")));
  </script>
</body>
</html>
