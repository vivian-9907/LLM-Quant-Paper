version: 2

source_groups:
  all:
    - arxiv
    - github
    - huggingface
    - rss
    - github_releases
    - model_hubs
    - vendor_blogs
    - github_activity
  agent_products:
    - vendor_blogs
    - github
    - github_releases
    - rss
  papers:
    - arxiv
    - rss
  code:
    - github
    - github_releases
    - huggingface
    - rss
  artifacts:
    - huggingface
    - github
    - model_hubs
  releases:
    - github_releases
    - model_hubs
    - vendor_blogs
    - rss
  model_releases:
    - model_hubs
    - vendor_blogs
    - huggingface
  framework_releases:
    - github_releases
    - rss
  repo_activity:
    - github_activity
    - github_releases
  operator_kernels:
    - github_releases
    - github_activity
    - vendor_blogs
    - rss
  kernel_compiler:
    - arxiv
    - github
    - github_activity
    - vendor_blogs
    - rss
  briefing_required:
    - official_model_blogs
    - vendor_blogs
    - hardware_platform_reports
    - operator_kernel_reports
    - independent_technical_blogs
    - github_releases

sources:
  official_model_blogs:
    type: rss_or_web
    closing_sweep_required: true
    candidate_pages:
      - name: Z.ai research blog
        organization: Z.ai / Zhipu AI
        url: https://z.ai/blog
        priority: critical
        notes: Check dated model, training, serving, architecture and infrastructure posts; GLM-5.3-Flash on 2026-08-26 is a recall-regression example.
      - name: Qwen blog
        organization: Alibaba Qwen
        url: https://qwenlm.github.io/blog/
        priority: critical
      - name: DeepSeek news
        organization: DeepSeek
        url: https://api-docs.deepseek.com/news
        priority: critical
      - name: OpenAI news
        organization: OpenAI
        url: https://openai.com/news/
      - name: Anthropic news
        organization: Anthropic
        url: https://www.anthropic.com/news
      - name: Google DeepMind blog
        organization: Google DeepMind
        url: https://deepmind.google/discover/blog/
      - name: Meta AI blog
        organization: Meta AI
        url: https://ai.meta.com/blog/
      - name: Mistral AI news
        organization: Mistral AI
        url: https://mistral.ai/news/
    open_world_policy:
      trigger_when:
        - a new organization releases a high-signal model, system, hardware platform or open-source artifact
        - two independent alerts point to the same organization during the window
        - a new model appears in a major runtime release or model hub before the organization is tracked
      action: Resolve the official domain, scan its dated blog/news/changelog for the full window, and record the domain in coverage.
      retention: Add recurring high-signal official domains after editorial review; first discovery must not require a hard-coded entity rule.
  arxiv:
    type: api
    base_url: https://export.arxiv.org/api/query
    preferred_categories:
      - cs.LG
      - cs.CL
      - cs.AI
      - cs.DC
      - cs.PF
    search_fields:
      - title
      - abstract
    notes: 只使用配置主题搜索。优先关注近期论文、有代码、系统证据充分或实验扎实的工作。

  github:
    type: api_or_web
    base_url: https://api.github.com/search/repositories
    sort_preferences:
      - updated
      - stars
    notes: 优先关注论文关联仓库、量化/infra kernel、runtime 集成、活跃项目和有 benchmark 支撑的实现。

  github_releases:
    type: api_or_web
    base_url: https://api.github.com/repos/{owner}/{repo}/releases
    tracked_repositories_ref: config/tracked-repos.yml
    source_mode: github_releases
    candidate_signals:
      - new model support
      - serving feature
      - quantization
      - FP8
      - FP4
      - KV cache
      - speculative decoding
      - MoE
      - kernel
      - distributed training
      - communication overlap
      - optimizer sharding
      - benchmark
      - breaking change
    notes: 跟踪框架、训练系统和 kernel 项目的 release。只保留和模型支持、serving/runtime、训练系统、量化、kernel、性能或兼容性相关的版本变化。

  github_activity:
    type: api_or_web
    base_url: https://api.github.com/search/issues
    tracked_repositories_ref: config/tracked-repos.yml
    source_mode: github_activity
    candidate_signals:
      - merged PR
      - active PR cluster
      - new model support
      - quantization
      - kernel
      - KV cache
      - MoE
      - distributed training
      - communication overlap
      - optimizer sharding
      - speculative decoding
      - batching
      - performance regression or fix
      - breaking change
    notes: 跟踪重要推理、训练、算子和 runtime 仓库的近期 PR / issue / merge 趋势。输出趋势，不堆 commit 或 PR 列表；只保留和模型支持、量化、serving、training、kernel、性能、兼容性或 breaking change 有关的变化。

  huggingface:
    type: hub_or_web
    base_url: https://huggingface.co
    search_targets:
      - models
      - datasets
      - papers
      - spaces
    candidate_signals:
      - quantized checkpoint
      - model card
      - safetensors
      - GGUF
      - GPTQ
      - AWQ
      - EXL2
      - FP8
      - FP4
      - MXFP4
      - NVFP4
      - INT8
      - INT4
      - benchmark
      - inference example
      - vLLM
      - SGLang
      - TensorRT-LLM
      - llama.cpp
    notes: 关注 Hugging Face Hub 上的量化 checkpoint、模型卡、paper/project 关联、artifact、benchmark 和推理/runtime 使用说明。不要把它扩展成泛模型能力新闻监控；只保留和 LLM 量化、压缩、serving、runtime 或 kernel 落地相关的条目。

  model_hubs:
    type: hub_or_web
    search_targets:
      - Hugging Face models
      - Hugging Face papers
      - ModelScope models
      - official model cards
    candidate_signals:
      - new model version
      - model card
      - context length
      - architecture
      - tokenizer
      - quantized checkpoint
      - FP8
      - FP4
      - GGUF
      - safetensors
      - vLLM
      - SGLang
      - TensorRT-LLM
      - benchmark
      - license
    notes: 跟踪模型版本发布和模型卡更新。保留条件是它对量化、serving、context length、架构、runtime 兼容、artifact 或 benchmark 有信息增量。

  rss:
    type: rss
    feeds:
      - name: NVIDIA technical blog
        url: https://developer.nvidia.com/blog/feed
      - name: Hugging Face blog
        url: https://huggingface.co/blog/feed.xml
      - name: 科学空间
        url: https://kexue.fm/feed
    candidate_pages:
      - name: vLLM blog
        url: https://vllm.ai/blog
        note: 除非发现当前可用 RSS/Atom feed，否则按普通页面来源处理。
      - name: SGLang / LMSYS blog
        url: https://lmsys.org/blog/
        note: 除非发现当前可用 RSS/Atom feed，否则按普通页面来源处理。
    notes: RSS 用来接入实验室、公司、博客和工程团队更新。只有技术相关且信息充分的条目才保留。

  vendor_blogs:
    type: rss_or_web
    feeds:
      - name: Hugging Face blog
        url: https://huggingface.co/blog/feed.xml
      - name: NVIDIA technical blog
        url: https://developer.nvidia.com/blog/feed
      - name: Google DeepMind blog
        url: https://deepmind.google/discover/blog/rss.xml
    candidate_pages:
      - name: Z.ai research blog
        url: https://z.ai/blog
      - name: NVIDIA official blog
        url: https://blogs.nvidia.com/
      - name: NVIDIA Research publications
        url: https://research.nvidia.com/publications
      - name: OpenAI news
        url: https://openai.com/news/
      - name: Anthropic news
        url: https://www.anthropic.com/news
      - name: Meta AI blog
        url: https://ai.meta.com/blog/
      - name: Mistral AI news
        url: https://mistral.ai/news/
      - name: Qwen blog
        url: https://qwenlm.github.io/blog/
      - name: DeepSeek news
        url: https://api-docs.deepseek.com/news
      - name: vLLM blog
        url: https://vllm.ai/blog
      - name: SGLang / LMSYS blog
        url: https://lmsys.org/blog/
    candidate_signals:
      - new model
      - new model version
      - context length
      - architecture
      - open weights
      - inference
      - serving
      - benchmark
      - quantization
      - kernel
      - kernel compiler
      - GPU DSL
      - intermediate representation
      - compiler-agent co-design
      - kernel generation
      - verifier
      - cost model
      - framework release
      - agent product
      - coding agent
      - IDE
      - CLI
      - GitHub integration
      - tool use
    notes: 跟踪官方模型发布、agent 产品更新、技术博客和框架公告。过滤掉只有营销描述、没有技术细节或没有 infra/quantization/agent 关联的普通新闻。

  independent_technical_blogs:
    type: rss_or_web
    candidate_pages:
      - name: 科学空间 / 苏剑林
        url: https://kexue.fm/
        feed: https://kexue.fm/feed
        focus:
          - model architecture
          - training objectives
          - attention and positional encoding
          - long context
          - technical model analysis
    discovery_policy:
      - Track named high-signal experts, but also discover technical posts linked by papers, repositories and official releases.
      - A blog is context or recommended reading unless it is itself the dated technical release.
      - Preserve the distinction between the blog publication date and the model or paper date it discusses.
    notes: 只保留有推导、机制拆解、实验或实现细节的文章；观点性转述和普通新闻摘要过滤。

  hardware_platform_reports:
    type: rss_or_web
    candidate_pages:
      - name: NVIDIA technical blog
        url: https://developer.nvidia.com/blog/
      - name: NVIDIA official blog
        url: https://blogs.nvidia.com/
      - name: Google Cloud AI Hypercomputer blog
        url: https://cloud.google.com/blog/products/compute
      - name: AMD Instinct product and blog pages
        url: https://www.amd.com/en/products/accelerators/instinct.html
    candidate_signals:
      - GPU architecture
      - accelerator architecture
      - rack-scale system
      - interconnect
      - memory bandwidth
      - HBM
      - HBM4
      - low-bit hardware path
      - performance per watt
      - token cost
      - tokens per watt
      - MoE all-to-all
      - long-context attention
      - KV cache capacity
      - partner benchmark
      - deployment status
    notes: >
      专门补硬件平台和 AI factory 官方报告召回。只保留有具体系统指标、
      rack/topology/interconnect、serving/training bottleneck、token cost、
      power/cooling、partner benchmark 或 deployment 证据的内容；纯发布口号过滤。

  operator_kernel_reports:
    type: repo_release_activity_or_web
    tracked_repositories_ref: config/tracked-repos.yml
    preferred_repositories:
      - flashinfer-ai/flashinfer
      - triton-lang/triton
      - NVIDIA/cutlass
      - NVIDIA/cudnn-frontend
      - NVIDIA/TensorRT-LLM
      - sgl-project/sglang
      - vllm-project/vllm
      - huggingface/transformers
    candidate_pages:
      - name: Ascend CANN / CANN Community
        url: https://www.hiascend.com/software/cann
      - name: Ascend open-source repositories
        url: https://gitee.com/ascend
      - name: FlashInfer releases
        url: https://github.com/flashinfer-ai/flashinfer/releases
      - name: Triton releases
        url: https://github.com/triton-lang/triton/releases
      - name: CUTLASS releases
        url: https://github.com/NVIDIA/cutlass/releases
      - name: cuDNN Frontend releases
        url: https://github.com/NVIDIA/cudnn-frontend/releases
    candidate_signals:
      - Ascend NPU
      - CANN
      - ATB
      - torch-npu
      - custom operator
      - fused operator
      - graph fusion
      - FlashInfer
      - Triton
      - CUTLASS
      - cuDNN Frontend
      - TensorRT-LLM kernel
      - SGLang kernel
      - vLLM kernel
      - FlashAttention
      - MLA
      - MoE GEMM
      - grouped GEMM
      - fused MoE
      - FP8
      - FP4
      - NVFP4
      - MXFP4
      - INT4
      - TMA
      - WGMMA
      - TMEM
      - swizzle
      - blockscale
      - ROCm
      - HIP
      - gfx950
      - benchmark
    notes: >
      专门补算子、kernel、compiler backend 和硬件后端适配召回。重点保留会改变
      LLM serving/training 性能路径的更新：Ascend CANN/ATB/torch-npu、
      Triton/CUTLASS/FlashInfer/cuDNN Frontend、TensorRT-LLM/SGLang/vLLM
      kernel backend、MoE/MLA/FlashAttention/low-bit GEMM/fusion，以及带
      latency、throughput、bandwidth、occupancy 或 memory traffic 证据的实现。
      只有自动 nightly build 或纯 binary packaging 且无 kernel 信息时，放入
      Near Miss 或 watch，不作为高优先级候选。

future_sources:
  - name: SSRN
    reason: 可能包含 working paper，但第一版优先做更容易自动化的技术来源。
  - name: PapersWithCode
    reason: 适合补充论文、代码和 benchmark 关联；当前先通过 GitHub/HF 和搜索间接覆盖。
