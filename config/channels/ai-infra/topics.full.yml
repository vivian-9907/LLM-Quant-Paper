version: 1
channel: ai-infra
scope_note: >
  固定研究范围：AI infrastructure / LLM infrastructure，包括模型架构、
  训练与推理系统、serving/runtime、调度、KV cache、speculative decoding、
  MoE、通信并行、kernel/operator、硬件亲和和端到端性能分析。

core_topics:
  serving_and_runtime:
    description: LLM serving、runtime、推理框架、吞吐/延迟优化和生产部署。
    include:
      - vLLM
      - SGLang
      - TensorRT-LLM
      - llama.cpp
      - inference engine
      - inference server
      - serving
      - continuous batching
      - paged attention
      - chunked prefill
      - prefix cache
      - disaggregated serving
      - KV cache
      - scheduler
      - TTFT
      - TPOT
    synonyms:
      - LLM serving
      - runtime system
      - inference runtime

  speculative_decoding:
    description: 投机推理、draft/target 协同、并行验证和解码加速。
    include:
      - speculative decoding
      - speculative inference
      - draft model
      - target model verification
      - tree attention
      - EAGLE
      - Medusa
      - lookahead decoding
      - multi-token prediction
      - MTP
      - parallel decoding
    synonyms:
      - spec decode
      - draft verification

  moe_systems:
    description: MoE 架构、expert parallel、通信掩盖、路由、MegaMoE/DeepEP 类系统优化。
    include:
      - mixture of experts
      - MoE
      - expert parallelism
      - expert parallel
      - all-to-all
      - dispatch
      - combine
      - DeepEP
      - MegaMoE
      - grouped GEMM
      - expert routing
      - load balancing
      - expert placement
      - EP overlap
      - communication overlap
    synonyms:
      - sparse expert system
      - MoE serving
      - MoE training

  training_systems:
    description: 训练系统、并行策略、checkpoint、optimizer/sharding 和 step-time 优化。
    include:
      - distributed training
      - data parallelism
      - tensor parallelism
      - pipeline parallelism
      - sequence parallelism
      - FSDP
      - ZeRO
      - Megatron
      - DeepSpeed
      - checkpointing
      - activation checkpointing
      - optimizer sharding
      - step time
      - MFU
    synonyms:
      - training infra
      - large scale training

  communication_and_parallelism:
    description: 通信、并行、collective、拓扑亲和和 overlap。
    include:
      - NCCL
      - collective communication
      - all reduce
      - all gather
      - reduce scatter
      - all-to-all
      - topology aware
      - communication overlap
      - network topology
      - NVLink
      - InfiniBand
      - HCCL
      - parallelism
    synonyms:
      - comm overlap
      - distributed systems

  kernels_and_operators:
    description: Attention、GEMM、MoE、Norm、RoPE、quant/dequant 等算子实现和融合优化。
    include:
      - CUDA kernel
      - Triton kernel
      - operator fusion
      - fused kernel
      - FlashAttention
      - FlashInfer
      - CUTLASS
      - GEMM
      - grouped GEMM
      - matmul
      - RMSNorm
      - RoPE
      - dequantization
      - memory bandwidth
      - tensor core
      - custom operator
    synonyms:
      - kernel optimization
      - operator implementation

  kernel_compilers:
    description: GPU kernel 编译、DSL/IR、自动调优与 agentic kernel evolution。重点关注 NVIDIA Research 及能进入 NVIDIA kernel/library/runtime 路径的工作；这是常规研究主题，不是强制 smoke check。
    include:
      - GPU kernel compiler
      - compiler-agent co-design
      - agentic kernel generation
      - kernel synthesis
      - kernel evolution
      - GPU DSL
      - hardware-explicit IR
      - schedule representation
      - warp specialization
      - memory movement
      - synchronization verifier
      - kernel verifier
      - compiler diagnostics
      - cost model
      - autotuning
      - library generalization
      - kernel dispatch
    synonyms:
      - LLM-driven kernel generation
      - autonomous kernel optimization
      - compiler harness
      - schedule search
      - program synthesis for GPU kernels

  gpu_architecture_and_hardware_platforms:
    description: 硬件平台、互联、内存层级、rack-scale 系统和低比特硬件路径。只在影响 LLM serving/training bottleneck 时保留。
    include:
      - accelerator architecture
      - GPU architecture
      - hardware architecture
      - hardware platform
      - hardware-software co-design
      - HBM
      - NVLink
      - NVSwitch
      - interconnect
      - rack-scale system
      - tensor core
      - Transformer Engine
      - FP8
      - FP4
      - NVFP4
      - MXFP4
      - memory bandwidth
      - interconnect bandwidth
      - power and cooling
      - MoE weight movement
      - KV cache capacity
    synonyms:
      - AI accelerator
      - GPU platform
      - rack-scale AI system
      - hardware platform with infra impact

  model_architecture_for_infra:
    description: 会改变系统瓶颈或算子形态的新模型结构。
    include:
      - Transformer architecture
      - attention mechanism
      - attention architecture
      - sparse attention
      - linear attention
      - hybrid attention
      - sliding window attention
      - attention sink
      - KV cache layout
      - state space model
      - Mamba
      - MLA
      - GQA
      - MQA
      - RoPE
      - long context
      - memory layer
      - lookup memory
      - n-gram embedding
      - MoE architecture
      - routed experts
      - shared experts
      - expert choice
      - hierarchical MoE
      - router load balancing
      - sparse expert architecture
      - residual stream
      - residual stream expansion
      - Hyper-Connections
      - expanded Hyper-Connections
      - xHC
      - mHC
      - sparse residual stream
      - MoE pre-training efficiency
      - training FLOPs
      - memory traffic
      - memory bandwidth reduction
    synonyms:
      - architecture infra impact
      - systems-aware architecture
      - architecture with systems impact
      - attention architecture infra impact
      - MoE architecture infra impact
      - residual-stream architecture
      - large-N residual streams

  performance_analysis:
    description: 端到端性能分析、profiling、benchmark、瓶颈定位和指标体系。
    include:
      - profiling
      - benchmark
      - end-to-end performance
      - bottleneck analysis
      - roofline
      - latency breakdown
      - throughput
      - TTFT
      - TPOT
      - P99
      - memory footprint
      - utilization
      - MFU
    synonyms:
      - performance engineering
      - systems benchmark

exclude:
  - pure model capability news without systems detail
  - product launch without technical evidence
  - generic AI agent workflow without infra/runtime relevance
  - pure application layer prompt engineering
