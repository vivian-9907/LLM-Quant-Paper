version: 1
channel: ai-infra
default_read: true

scope: >
  LLM infrastructure: serving/runtime, training systems, MoE, communication,
  kernels/operators, hardware affinity, model releases with systems impact,
  and end-to-end performance analysis.

core_focus:
  - vLLM / SGLang / TensorRT-LLM / llama.cpp serving and release changes
  - speculative decoding, KV cache, scheduler, prefill/decode, batching
  - MoE systems, expert parallelism, dispatch/combine, communication overlap
  - distributed training, parallelism, checkpointing, optimizer sharding
  - CUDA / Triton / CUTLASS / FlashInfer / Ascend CANN / ATB kernels and operator fusion
  - kernel compiler research: GPU DSL/IR, hardware-explicit schedules, agentic kernel generation/evolution, verifier, cost model, compiler diagnostics and library generalization; prioritize NVIDIA Research and NVIDIA upstream artifacts
  - hardware platform updates with infra impact: memory bandwidth, interconnect, tensor cores, rack-scale systems, power/cooling, cost efficiency and low-bit hardware paths that change serving/training bottlenecks
  - attention architecture with infra impact: KV-sharing / low-rank / grouped attention variants, sparse / linear / hybrid attention, state-space-style blocks, long-context attention and KV/cache shape changes
  - MoE architecture with infra impact: sparse expert models, routed experts, shared experts, expert choice, hierarchical MoE, DeepSeek/GLM/Mixtral-style routing and load-balancing changes
  - architecture infra impact: residual stream design, Hyper-Connections, sparse / expanded residual paths, memory traffic, training FLOPs and architecture changes that alter compute or communication shape
  - model versions whose release notes include context length, architecture, serving, kernel or hardware implications

required_smoke_checks:
  hardware_platform_reports:
    required_for_regular_radar: true
    purpose: >
      Prevent missing official hardware / AI factory technical reports that do
      not appear in paper or framework-release searches.
    exact_query_terms:
      - Rubin
      - Blackwell
      - Instinct
      - TPU
      - AI Hypercomputer
      - NVLink
      - rack-scale
      - AI factory
    official_source_terms:
      - site:developer.nvidia.com/blog Rubin GPU architecture
      - site:developer.nvidia.com/blog Rubin NVLink HBM4
      - site:developer.nvidia.com/blog Blackwell NVLink rack-scale
      - site:blogs.nvidia.com Rubin AI factory
      - site:cloud.google.com/blog TPU AI Hypercomputer
      - site:amd.com Instinct AI accelerator
    expand_hardware_platform_reports_if_any:
      - official platform report
      - architecture deep dive
      - HBM / HBM4 / memory bandwidth
      - interconnect / NVLink / fabric
      - rack-scale / NVL / AI factory
      - power / cooling / tokens per watt
      - MoE / all-to-all / expert routing
      - long-context attention / KV cache capacity
      - partner benchmark / deployment status
  operator_kernel_reports:
    required_for_regular_radar: true
    purpose: >
      Prevent missing kernel/operator/compiler-backend changes that matter to
      teams with Ascend/CANN/ATB or GPU operator backgrounds. These updates are
      often buried in repo activity, nightly releases, framework changelogs or
      backend-specific PRs, and can be drowned out by model and hardware news.
    exact_query_terms:
      - Ascend CANN
      - Ascend ATB
      - torch-npu
      - Triton kernel
      - FlashInfer
      - CUTLASS
      - cuDNN frontend
      - TensorRT-LLM kernel
      - SGLang kernel
      - vLLM kernel
      - ROCm kernel
      - MoE GEMM
      - MLA kernel
      - FlashAttention
      - fused operator
      - agentic kernel generation
      - autonomous kernel optimization
      - compiler-agent co-design
      - LLM operator generation
      - kernel superagent
    official_source_terms:
      - site:gitee.com/ascend CANN release operator
      - site:gitee.com/ascend torch_npu release
      - site:hiascend.com CANN release notes
      - site:github.com/flashinfer-ai/flashinfer releases kernel
      - site:github.com/triton-lang/triton releases kernel
      - site:github.com/NVIDIA/cutlass releases kernel
      - site:github.com/NVIDIA/TensorRT-LLM releases kernel
      - site:github.com/sgl-project/sglang releases kernel
      - site:github.com/vllm-project/vllm releases kernel
      - site:arxiv.org agentic kernel generation compiler verifier
      - site:openreview.net kernel agent hardware-aware unit tests
      - site:github.com kernel agent operator generation benchmark
    expand_operator_kernel_reports_if_any:
      - CANN / ATB / torch-npu release note
      - Ascend NPU kernel or operator support
      - custom operator, fused operator or graph fusion
      - Triton / CUTLASS / FlashInfer / cuDNN Frontend release
      - TensorRT-LLM / SGLang / vLLM kernel backend integration
      - MLA / FlashMLA / FlashAttention / GQA / MQA kernel
      - MoE GEMM / grouped GEMM / routed MoE / fused MoE
      - FP8 / FP4 / NVFP4 / MXFP4 / INT4 low-bit kernel path
      - TMA / WGMMA / TMEM / blockscale / swizzle / layout optimization
      - ROCm / HIP / gfx950 / MI300 / MI350 backend path
      - benchmark with latency, throughput, bandwidth, occupancy or memory traffic
      - agent-generated kernel with correctness gate, profiler loop, search budget or upstream integration

strong_signals:
  - release notes, code changes, benchmark, paper, model card or artifact
  - explicit latency, throughput, memory, scaling, MFU, TTFT/TPOT/P99 or cost result
  - concrete runtime/framework/kernel/hardware detail
  - concrete operator or compiler-backend detail such as CANN/ATB/torch-npu, Triton, CUTLASS, FlashInfer, cuDNN Frontend, fused MoE, MLA/FlashAttention, low-bit GEMM, TMA/WGMMA/TMEM, ROCm/HIP or Ascend NPU support
  - compiler-agent or kernel-generation work with a concrete IR/schedule representation, correctness verifier, cost model, localized diagnostics, hardware mapping, end-to-end kernel benchmark or upstream integration
  - hardware platform detail that affects memory bandwidth, interconnect, low-bit execution, rack-scale communication, KV cache capacity, MoE weight movement, power/cooling, cost efficiency or deployment cost
  - architecture change that affects compute graph, memory, communication, training FLOPs, memory traffic or serving shape
  - attention or MoE architecture change that affects KV cache layout, prefill/decode cost, routing, all-to-all, expert parallelism, kernel/operator shape, batching, long-context serving or training efficiency
  - model-architecture paper with implementation detail such as residual-stream expansion, Hyper-Connections, xHC/mHC, sparse residual paths, MoE pre-training efficiency, or memory-bandwidth reduction
  - official hardware platform report with concrete system metrics such as interconnect bandwidth, rack-scale topology, all-to-all fabric, scale-out network, deployment status, token cost, power efficiency or partner benchmark

noise_filters:
  - pure product launch without technical detail
  - generic model capability news without infra implications
  - architecture paper that reports only accuracy or capability without compute, memory, scaling, kernel, training or serving implications
  - application-layer agent or prompt workflow without runtime/system relevance
  - unverified social posts without a paper, code, model card or official note

expand_when_needed:
  topics_full: config/channels/ai-infra/topics.full.yml
  research_map: references/channels/ai-infra-map.md
