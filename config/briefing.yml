version: 3

purpose: >
  Build one LLM Infra briefing from parallel topic scouts. Each scout performs
  known-ecosystem and open-world recall, then contributes structured events to
  one candidate pool; scouts and topics are not publication channels.

recall:
  topology: config/topic-scouts.yml
  execution: parallel_topic_scouts
  required_modes_per_scout:
    - known_ecosystem
    - open_world
  merge_into_one_candidate_pool: true
  deduplicate_by_event: true
  allow_multiple_topics_per_event: true
  allow_multiple_scouts_per_event: true
  coverage_matrix_required: true
  smoke_checks_are_coverage: false

gap_audit:
  required_before_closing_sweep: true
  config: config/topic-scouts.yml
  rules:
    - Every scout x event-slot cell must record checked_with_hits, checked_empty or access_failed.
    - A hit from another scout does not close a missing cell.
    - Access failures require an alternate-source attempt or an explicit unresolved note.
    - Closing sweep must revisit unresolved topic gaps as well as late-window source classes.
    - For high-value repositories, scan release tags, prereleases, staged changelogs and merged work clusters; an empty formal-release feed does not close the repository cell.
    - Expand repository families when a signal crosses projects, for example Dynamo plus NIXL/LMCache or CUTLASS/CuTe plus cuTile.
    - Inspect a 7-day adjacent lookback for high-value events first discovered late; publish them only as dated context when outside the window.

closing_sweep:
  lookback_hours: 72
  required: true
  required_source_classes:
    - official_model_blogs
    - nvidia_technical
    - repository_releases
    - hardware_platforms
    - independent_blogs
    - emerging_official_domains
  rules:
    - Recheck publication time, release status and first-party links at the end of the window.
    - A newly important organization must trigger an official-domain sweep even when absent from the watchlist.
    - Search snippets and social posts are alerts only; promote claims only after primary-source verification.
    - Log an explicit empty result for every required source class instead of silently skipping it.

publication:
  canonical_source: edition.json
  primary_artifact: briefing.html
  optional_artifacts:
    - briefing.md
  one_page: true
  layout: unified_editorial_stream
  section_title: 本期进展
  title_style: date_range
  default_theme: pink-purple
  category_order:
    - models
    - repositories
    - quantization
    - systems
    - kernels
    - hardware
    - technical_blogs
  system_layer_order:
    - models_and_architecture
    - training_and_quantization
    - serving_runtime_and_systems
    - kernels_compilers_and_operators
    - hardware_interconnect_and_platforms
  editorial_section_order:
    - model_progress
    - repository_progress
    - quantization_low_bit
    - serving_runtime_systems
    - kernels_compilers_operators
    - hardware_platforms
  model_tracker:
    visual: vertical_timeline
    required_fields:
      - organization
      - version
      - architecture
      - attentionPattern
      - quantization
      - architectureFigure_or_explicit_unavailable
      - generationDelta
    optional_fields:
      - availability
  repository_digest:
    render_release_inventory: false
    theme_count: 2_to_4
    concrete_signals_per_theme: 2_to_4
    require_named_repository_and_execution_path: true
    recommended_link_count: 3_to_5
    recommended_link_source_role: primary
    require_reason_per_link: true
  editorial_contract:
    - Prefer dated technical deltas over generic trends.
    - Keep model, repository and paper names explicit.
    - Expand headline, recommended and risk items as point, evidence, boundary and use.
    - Label background, preannouncement, preview and author-reported results.
    - Let technical blogs inherit the system layer of the mechanism they explain.
    - Use fixed editorial sections for the HTML; do not publish scout ids, topics or storylines as the primary table of contents.
    - Allow one event in multiple editorial sections with section-specific points, but present it only once in its primary section.
    - Render repository progress as cross-repository themes plus a small set of reasoned primary-source links, not as a release inventory.
    - Keep repository themes skimmable but substantive: each theme names 2 to 4 concrete repositories or releases and the execution path they changed.
    - Prefer an official blog, paper, report or model-card architecture figure; never substitute a self-drawn diagram, and record explicit unavailability when no official figure exists.
    - Require each model card to show a before/after/impact comparison with its own previous generation.
    - Require each model card to state the attention mix or explicit non-disclosure; for hybrid stacks include the layer ratio or counts when primary artifacts disclose them.
    - Use one final presentation: expand headline, recommended and risk items; render full_only and context as light signals without repeated evidence blocks.
    - When two or more verified items form a decision-relevant subdirection inside a fixed section, publish an optional section spotlight; keep it inside that section and state which evidence is in-window versus adjacent context.
    - Treat agentic kernel/operator engineering as a required kernel-scout subtopic, including direct code generation, compiler-mediated search, verifier-guided optimization, RL-trained kernel agents and multi-agent or superagent workflows.
    - Write the group-facing HTML for an infrastructure reader who may not know project-specific acronyms; define unfamiliar terms on first use with one plain-language clause.
    - Evidence prose is not a verification log. Keep only one or two facts that make the conclusion credible; put detailed audit facts in verificationNotes and hide low-level source links from HTML with display: false.
    - Require readerValue on every repository theme and section spotlight so each one states which reader decision or understanding it changes.
    - Do not create a standalone repository theme for routine upgrade compatibility. Keep a compatibility caveat only when it changes the decision about a specific item.

    - Treat cross-domain storylines as optional synthesis after the fixed sections, never as a replacement for them.
    - Do not force a one-sentence trend or takeaway.
    - Do not publish team advice, next-window watchlists or verification appendices by default.
    - Make the group-facing HTML self-contained: embed local edition assets as data URLs and keep the canonical files under the edition assets directory.

quality_gates:
  require_primary_source_for_published_items: true
  require_window_role: true
  require_boundary_for_non_window_items: true
  require_release_maturity: true
  require_sidebar_anchor_integrity: true
  warn_on_verification_log_evidence: true
  warn_on_dense_unexplained_acronyms: true
  forbidden_default_sections:
    - 对团队的建议
    - 下一窗口观察清单
    - 来源与核验
    - 技术趋势
